services:
  storavix:
    build: .
    container_name: storavix
    restart: unless-stopped
    environment:
      STORAVIX_LISTEN: 0.0.0.0:8080
      STORAVIX_DATA_DIR: /data
      # Set a strong first-run password in .env; remove it after provisioning.
      STORAVIX_ADMIN_USER: ${STORAVIX_ADMIN_USER:-admin}
      STORAVIX_ADMIN_PASSWORD: ${STORAVIX_ADMIN_PASSWORD:?Set STORAVIX_ADMIN_PASSWORD in .env}
      STORAVIX_SECURE_COOKIES: ${STORAVIX_SECURE_COOKIES:-false}
    ports:
      - "${STORAVIX_BIND_IP:-127.0.0.1}:8080:8080"
    volumes:
      - storavix-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 4s
      retries: 3
volumes:
  storavix-data:
