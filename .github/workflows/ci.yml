name: CI and builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit tests
        run: go test -race ./...
      - name: Go vet
        run: go vet ./...
      - name: Browser JavaScript syntax
        run: node --check internal/web/static/app.js
      - name: Windows PowerShell scripts must be ASCII safe for PS5.1
        run: |
          python3 - <<'PYCI'
          from pathlib import Path
          for name in ('scripts/install-agent-online-windows.ps1', 'scripts/install-agent-windows.ps1', 'scripts/configure-agent-windows.ps1'):
              if any(b > 127 for b in Path(name).read_bytes()):
                  raise SystemExit(f'{name}: invalid source encoding for Windows PowerShell 5.1')
          PYCI
  powershell51-parser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @('scripts/install-agent-online-windows.ps1', 'scripts/install-agent-windows.ps1', 'scripts/configure-agent-windows.ps1')) {
            $tokens = $null
            $errors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw "PowerShell 5.1 parser failed: $path" }
            Write-Host "PS5.1 parse passed: $path"
          }
      - name: Exercise Windows native architecture detection with PowerShell 5.1
        shell: powershell
        run: |
          $arch = & ./scripts/install-agent-online-windows.ps1 -ArchitectureOnly
          if ($arch -ne 'amd64') { throw "Expected amd64 on windows-latest; got '$arch'" }
          Write-Host "Native architecture detection passed: $arch"
      - name: Validate Linux scripts
        run: bash -n scripts/*.sh
  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {os: linux, arch: amd64, ext: ''}
          - {os: linux, arch: arm64, ext: ''}
          - {os: windows, arch: amd64, ext: '.exe'}
          - {os: windows, arch: arm64, ext: '.exe'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Compile Storavix server and agent
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o dist/storavix-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/storavix
          go build -trimpath -ldflags='-s -w' -o dist/storavix-agent-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }} ./cmd/storavix-agent
      - uses: actions/upload-artifact@v4
        with:
          name: storavix-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  windows-installers:
    needs: [test, powershell51-parser]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build bundled Windows x64 agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build, dist | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w" -o build/storavix-agent.exe ./cmd/storavix-agent
          if ($LASTEXITCODE -ne 0) { throw 'Agent compilation failed.' }
      - name: Build self-contained MSI with WiX
        shell: pwsh
        run: |
          dotnet tool install --tool-path .\wix-tools wix --version 5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX setup failed.' }
          .\wix-tools\wix.exe extension add -g WixToolset.UI.wixext/5.0.2
          .\wix-tools\wix.exe extension add -g WixToolset.Util.wixext/5.0.2
          if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension setup failed.' }
          $root = (Get-Location).Path
          .\wix-tools\wix.exe build installer/windows/StoravixAgent.wxs -arch x64 -ext WixToolset.UI.wixext -ext WixToolset.Util.wixext -d "AgentExe=$root\build\storavix-agent.exe" -d "SourceRoot=$root" -o dist/StoravixAgent-windows-amd64.msi
          if ($LASTEXITCODE -ne 0) { throw 'MSI build failed.' }
      - name: Build offline Setup EXE with Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup setup failed.' }
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe was not found after installation.' }
          $root = (Get-Location).Path
          & $iscc "/DSourceRoot=$root" installer/windows/StoravixAgent.iss
          if ($LASTEXITCODE -ne 0) { throw 'EXE build failed.' }
      - name: Validate both offline installers
        shell: pwsh
        run: |
          $msi = (Resolve-Path 'dist/StoravixAgent-windows-amd64.msi').Path
          $exe = (Resolve-Path 'dist/StoravixAgent-Setup-windows-amd64.exe').Path
          if ((Get-Item $msi).Length -lt 100000) { throw 'MSI is unexpectedly small.' }
          if ((Get-Item $exe).Length -lt 100000) { throw 'EXE is unexpectedly small.' }
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/i', ('"' + $msi + '"'), '/qn', '/norestart', '/l*v', 'msi-install.log')
          if ($p.ExitCode -notin @(0,3010)) { Get-Content 'msi-install.log' -Tail 100; throw "MSI smoke test failed: $($p.ExitCode)" }
          $agentInstallDir = Join-Path $env:ProgramFiles 'Storavix Agent'
          if (-not (Test-Path (Join-Path $agentInstallDir 'storavix-agent.exe'))) { throw 'MSI did not install the agent EXE.' }
          if (-not (Test-Path (Join-Path $agentInstallDir 'configure-agent-windows.ps1'))) { throw 'MSI did not install configuration wizard.' }

          # Configuration smoke test: the old CI only checked extracted files, not a working agent.
          $tokenFile = Join-Path $env:RUNNER_TEMP 'storavix-test-token.txt'
          [System.IO.File]::WriteAllText($tokenFile, ('a' * 64))
          $wizard = Join-Path $agentInstallDir 'configure-agent-windows.ps1'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wizard -Console -ServerUrl 'http://127.0.0.1:65503' -RegistrationTokenFile $tokenFile
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:ProgramData 'StoravixAgent/setup.log') -Tail 40 -ErrorAction SilentlyContinue
            throw "MSI installed files but agent configuration did not succeed"
          }
          $task = Get-ScheduledTask -TaskName 'StoravixAgent' -ErrorAction Stop
          if ($task.State -ne 'Running') { throw "MSI agent task state: $($task.State)" }
          if (-not (Test-Path (Join-Path $env:ProgramData 'StoravixAgent/token'))) { throw 'Agent token was not stored.' }
          $idPath = Join-Path $env:ProgramData 'StoravixAgent/agent.id'
          for ($i = 0; $i -lt 15 -and -not (Test-Path $idPath); $i++) { Start-Sleep -Seconds 1 }
          if (-not (Test-Path $idPath)) { throw 'Agent process did not create its identity file' }
          Write-Host 'MSI -> configure -> registered task -> agent process: PASS'
          Stop-ScheduledTask -TaskName StoravixAgent -ErrorAction SilentlyContinue
          Unregister-ScheduledTask -TaskName StoravixAgent -Confirm:$false -ErrorAction SilentlyContinue
          $u = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/x', ('"' + $msi + '"'), '/qn', '/norestart')
          if ($u.ExitCode -notin @(0,3010)) { throw "MSI uninstall test failed: $($u.ExitCode)" }
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART')
          if ($p.ExitCode -ne 0) { throw "EXE smoke test failed: $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $agentInstallDir 'storavix-agent.exe'))) { throw 'EXE did not install the agent.' }
          # The EXE includes the same offline wizard; validate it end-to-end after silent extraction.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $wizard -Console -ServerUrl 'http://127.0.0.1:65503' -RegistrationTokenFile $tokenFile
          if ($LASTEXITCODE -ne 0) {
            Get-Content (Join-Path $env:ProgramData 'StoravixAgent/setup.log') -Tail 40 -ErrorAction SilentlyContinue
            throw 'EXE agent registration failed'
          }
          $task = Get-ScheduledTask -TaskName 'StoravixAgent' -ErrorAction Stop
          if ($task.State -ne 'Running') { throw "EXE task not running: $($task.State)" }
          Write-Host 'EXE -> configure -> registered task -> agent running: PASS'

      - uses: actions/upload-artifact@v4
        with:
          name: storavix-windows-installers
          path: |
            dist/StoravixAgent-windows-amd64.msi
            dist/StoravixAgent-Setup-windows-amd64.exe
  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]')) ||
      github.event_name == 'workflow_dispatch'
    needs: [test, powershell51-parser, cross-build, windows-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            stage="$(mktemp -d)"
            mkdir -p "$stage/scripts"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$stage/storavix-agent" ./cmd/storavix-agent
            cp scripts/install-agent-linux.sh "$stage/scripts/"
            tar -czf "dist/storavix-agent-linux-$arch.tar.gz" -C "$stage" storavix-agent scripts/install-agent-linux.sh
            rm -rf "$stage"
            stage="$(mktemp -d)"
            mkdir -p "$stage/scripts"
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$stage/storavix-agent.exe" ./cmd/storavix-agent
            cp scripts/install-agent-windows.ps1 "$stage/scripts/"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/storavix-agent-windows-$arch.zip" storavix-agent.exe scripts)
            rm -rf "$stage"
            stage="$(mktemp -d)"
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$stage/storavix" ./cmd/storavix
            tar -czf "dist/storavix-server-linux-$arch.tar.gz" -C "$stage" storavix
            rm -rf "$stage"
            stage="$(mktemp -d)"
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$stage/storavix.exe" ./cmd/storavix
            (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/storavix-server-windows-$arch.zip" storavix.exe)
            rm -rf "$stage"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Retrieve Windows MSI and EXE
        uses: actions/download-artifact@v4
        with:
          name: storavix-windows-installers
          path: dist
      - name: Append Windows installer SHA256
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum StoravixAgent-windows-amd64.msi StoravixAgent-Setup-windows-amd64.exe >> SHA256SUMS)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="$GITHUB_REF_NAME"; fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$version" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$version" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Storavix $version" --notes-file docs/RELEASE-NOTES-RU.md --latest
          fi
